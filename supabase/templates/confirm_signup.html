<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu e-mail</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f6fb;font-family:Arial,Helvetica,sans-serif;color:#001f3f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f6fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #d8e2ef;">
            <tr>
              <td style="background:#001f3f;padding:28px 32px;">
                <p style="margin:0 0 8px;color:#f6c500;font-size:12px;letter-spacing:1.6px;font-weight:bold;">
                  CAMPANHA 2026
                </p>
                <h1 style="margin:0;color:#ffffff;font-size:24px;line-height:1.3;">
                  Confirme seu e-mail
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">
                  Olá,
                </p>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">
                  Use o código abaixo para validar sua conta. Digite-o na tela de
                  verificação da Campanha 2026. Ele expira em poucos minutos e
                  não deve ser compartilhado.
                </p>
                <p style="margin:0 0 28px;text-align:center;">
                  <span style="display:inline-block;letter-spacing:8px;font-size:32px;font-weight:bold;color:#001f3f;background:#f2f6fb;border:1px solid #d8e2ef;border-radius:12px;padding:14px 22px;">
                    {{ .Token }}
                  </span>
                </p>
                <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#667085;">
                  Se você não criou esta conta, ignore este e-mail.
                </p>
              </td>
            </tr>
            <tr>
              <td style="background:#003b73;padding:16px 32px;color:#ffffff;font-size:12px;">
                Trabalho para proteger o futuro.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
